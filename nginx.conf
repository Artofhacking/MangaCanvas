# Local / Docker verification config for MangaCanvas static hosting.
# Production template (port 18999, API proxy): deploy/nginx/mangacanvas.conf
#
# docker run --rm -p 8080:80 \
#   -v "$PWD/dist:/usr/share/nginx/html:ro" \
#   -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#   nginx:1.27-alpine

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite hashed bundles stay at /assets/* and must never fall back to HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # History-mode SPA. Do not use `$uri/` — a physical /assets directory
    # would 301 /assets (React route) to /assets/ and then 403.
    location / {
        try_files $uri /index.html;
    }
}
