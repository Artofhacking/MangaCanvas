# Production nginx template for MangaCanvas (ECS).
# Install as /etc/nginx/conf.d/mangacanvas.conf after reviewing upstreams.
# Does not contain secrets. Backend stays on 127.0.0.1:8088.
#
# Required behavior:
# - /project/:id/... and other history routes rewrite to index.html
# - /assets/* is only real Vite files (never HTML)
# - /assets (React page) is not 301'd into the static directory

server {
    listen 18999;
    server_name _;

    root /var/www/mangacanvas;
    index index.html;

    client_max_body_size 32m;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
