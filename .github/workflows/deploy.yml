name: Deploy

# GitHub-hosted runners cannot reach the ECS on port 22.
# Publish from a developer machine:
#   MANGACANVAS_SSH_KEY=/path/to/key.pem npm run deploy
on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Use the local deploy script
        run: |
          echo "Do not deploy from GitHub Actions."
          echo "On a machine that can SSH to the server:"
          echo "  MANGACANVAS_SSH_KEY=/path/to/key.pem npm run deploy"
          exit 1
