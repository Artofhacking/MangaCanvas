name: Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          CI: "true"
          VITE_MOCK_MODE: "false"
          VITE_APP_API_BASE_URL: /api/v1
