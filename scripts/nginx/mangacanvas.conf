server {
    listen 18999 default_server;
    listen [::]:18999 default_server;
    server_name _;
    # Keep in sync with deploy/nginx/mangacanvas.conf. ensure-nginx-spa.py rewrites
    # an already-installed conf; copying this file alone does not update ECS.
    client_max_body_size 128m;
    error_page 413 @canvas_body_too_large;

    location @canvas_body_too_large {
        default_type application/json;
        return 413 '{"code":1001,"message":"请求体过大，未能写入。请缩小图片或文件后重试","data":null}';
    }

    root /var/www/mangacanvas;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 600s covers most HappyHorse polls. Video hold TTL is 20 min; a 504 is released by sweeper.
        proxy_read_timeout 600s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
